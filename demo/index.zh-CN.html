<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkflow Editor - 中文演示</title>
    <!-- 引入编译后的 CSS -->
    <link rel="stylesheet" href="../dist/inkflow-editor.css" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 { margin-top: 0; color: #111827; }
        .lang-switch { margin-bottom: 20px; }
        .lang-switch a { color: #2563eb; text-decoration: none; margin-right: 15px; }
        .lang-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inkflow Editor</h1>
        <div class="lang-switch">
            <a href="index.html">🇬🇧 English</a>
            <a href="index.zh-CN.html">🇨🇳 中文</a>
        </div>
        
        <div id="editor-container">
            <h2>欢迎使用 Inkflow Editor</h2>
            <p>这是一款<strong>极其轻量</strong>且<em>高性能</em>的富文本编辑器。</p>
            <ul>
                <li>零外部依赖，纯原生开发</li>
                <li>基于事件驱动的优雅架构</li>
                <li>防内存溢出的稳定性能</li>
            </ul>
            <p>您可以尝试选中文本进行格式化，或者点击行内代码按钮编写 <code>代码片段</code>。</p>
        </div>
    </div>

    <!-- 引入编译后的 UMD 脚本 -->
    <script src="../dist/inkflow-editor.umd.js"></script>
    <script>
        const { InkflowEditor } = window.InkflowEditor;
        const editor = new InkflowEditor({
            container: '#editor-container',
            lang: 'zh-CN',
            placeholder: '在这里开始编写精彩的内容...'
        });
        
        editor.on('ready', () => console.log('编辑器加载完毕！'));
        
        // 暴露给 window 用于调试
        window.editor = editor;
    </script>
</body>
</html>
