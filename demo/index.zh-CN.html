<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkflow Editor - 中文演示</title>
    <!-- 引入编译后的 CSS -->
    <link rel="stylesheet" href="../dist/inkflow-editor.css" />
    <link rel="stylesheet" href="../dist/inkflow-editor-emoji.css" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 { margin-top: 0; color: #111827; }
        .lang-switch { margin-bottom: 20px; }
        .lang-switch a { color: #2563eb; text-decoration: none; margin-right: 15px; }
        .lang-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inkflow Editor</h1>
        <div class="lang-switch">
            <a href="index.html">🇬🇧 English</a>
            <a href="index.zh-CN.html">🇨🇳 中文</a>
        </div>
        
        <div id="editor-container">
            <h2>欢迎使用 Inkflow Editor</h2>
            <p>基于<strong>纯原生 JavaScript（Pure Vanilla JS）</strong>打造的高性能、轻量级富文本编辑器。</p>
            <ul>
                <li>零外部依赖，纯原生开发（Pure Vanilla JS）</li>
                <li>现代极简架构，事件驱动设计</li>
                <li>极致性能，无框架包袱</li>
            </ul>
            <p>您可以尝试选中文本进行格式化，或者点击行内代码按钮编写 <code>代码片段</code>。</p>
        </div>
    </div>

    <!-- 引入编译后的 UMD 脚本 -->
    <script src="../dist/inkflow-editor.umd.js"></script>
    <script src="../dist/inkflow-editor-emoji.umd.js"></script>
    <script>
        const { InkflowEditor } = window.InkflowEditor;
        const { emojiExtension } = window.InkflowEditorEmoji;
        const editor = new InkflowEditor({
            container: '#editor-container',
            lang: 'zh-CN',
            placeholder: '请在此输入您的精彩内容...',
            emoji: emojiExtension(),
            hooks: {
                onUploadImage: async (file) => {
                    return new Promise((resolve) => {
                        console.log('正在上传图片:', file.name);
                        setTimeout(() => {
                            resolve('https://picsum.photos/seed/' + Math.random() + '/600/400');
                        }, 1500);
                    });
                }
            }
        });
        
        editor.on('ready', () => console.log('编辑器加载完毕！'));
        
        // 暴露给 window 用于调试
        window.editor = editor;
    </script>
</body>
</html>
