<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkflow Editor - English Demo</title>
    <!-- Include compiled CSS -->
    <link rel="stylesheet" href="../dist/inkflow-editor.css" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 { margin-top: 0; color: #111827; }
        .lang-switch { margin-bottom: 20px; }
        .lang-switch a { color: #2563eb; text-decoration: none; margin-right: 15px; }
        .lang-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inkflow Editor</h1>
        <div class="lang-switch">
            <a href="index.html">🇬🇧 English</a>
            <a href="index.zh-CN.html">🇨🇳 中文</a>
        </div>
        
        <div id="editor-container">
            <h2>Welcome to Inkflow Editor</h2>
            <p>This is a <strong>lightweight</strong> and <em>high-performance</em> rich text editor.</p>
            <ul>
                <li>Zero dependencies</li>
                <li>World-class architecture</li>
                <li>Extremely fast</li>
            </ul>
            <p>Try selecting text to apply formatting, or click the code button to write <code>inline code</code>.</p>
        </div>
    </div>

    <!-- Include compiled UMD script -->
    <script src="../dist/inkflow-editor.umd.js"></script>
    <script>
        const { InkflowEditor } = window.InkflowEditor;
        const editor = new InkflowEditor({
            container: '#editor-container',
            lang: 'en-US',
            placeholder: 'Start writing your amazing content here...',
            hooks: {
                onUploadImage: async (file) => {
                    return new Promise((resolve) => {
                        console.log('Uploading image file:', file.name);
                        setTimeout(() => {
                            resolve('https://picsum.photos/seed/' + Math.random() + '/600/400');
                        }, 1500);
                    });
                }
            }
        });
        
        editor.on('ready', () => console.log('Editor is ready!'));
        
        // Expose to window for debugging
        window.editor = editor;
    </script>
</body>
</html>
